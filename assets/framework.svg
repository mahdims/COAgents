<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1120" height="520" fill="#ffffff"/>

  <!-- ===================== Panel 1: Partial Search Graph ===================== -->
  <rect x="20" y="20" width="440" height="480" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="240" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Partial Search Graph (history)</text>
  <text x="240" y="72" text-anchor="middle" font-size="12" fill="#64748b">nodes = visited solutions · solid edges = local moves · dashed = jumps</text>

  <!-- basin 0 (purged chain) -->
  <text x="60" y="108" font-size="11" fill="#94a3b8">basin 0 (purged)</text>
  <line x1="70" y1="150" x2="70" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="215" x2="70" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="135" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="200" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="265" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="269" text-anchor="middle" font-size="9" fill="#334155">min</text>

  <!-- jump edge basin0 -> basin1 -->
  <path d="M 84 265 C 120 300, 150 300, 185 265" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="135" y="312" text-anchor="middle" font-size="10" fill="#dc2626">jump</text>

  <!-- basin 1 (purged chain) -->
  <text x="175" y="108" font-size="11" fill="#94a3b8">basin 1 (purged)</text>
  <line x1="200" y1="150" x2="200" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="215" x2="200" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="200" cy="135" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="200" cy="200" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="200" cy="265" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="200" y="269" text-anchor="middle" font-size="9" fill="#334155">min</text>

  <!-- jump edge basin1 -> active -->
  <path d="M 214 265 C 250 300, 270 160, 316 138" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>

  <!-- active basin (tree) -->
  <text x="300" y="108" font-size="11" font-weight="600" fill="#1e293b">active basin (tree)</text>
  <!-- edges -->
  <line x1="330" y1="150" x2="330" y2="185" stroke="#475569" stroke-width="2"/>
  <line x1="322" y1="212" x2="290" y2="252" stroke="#475569" stroke-width="2"/>
  <line x1="338" y1="212" x2="370" y2="252" stroke="#475569" stroke-width="2"/>
  <line x1="290" y1="280" x2="290" y2="315" stroke="#475569" stroke-width="2"/>
  <line x1="378" y1="280" x2="400" y2="315" stroke="#475569" stroke-width="2"/>
  <line x1="362" y1="280" x2="345" y2="315" stroke="#475569" stroke-width="2"/>
  <!-- nodes -->
  <circle cx="330" cy="135" r="14" fill="#fff" stroke="#475569" stroke-width="2"/>
  <circle cx="330" cy="200" r="14" fill="#fff" stroke="#475569" stroke-width="2"/>
  <circle cx="290" cy="265" r="14" fill="#fff" stroke="#475569" stroke-width="2"/>
  <circle cx="370" cy="265" r="14" fill="#fff" stroke="#475569" stroke-width="2"/>
  <circle cx="290" cy="330" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="345" cy="330" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <circle cx="405" cy="330" r="14" fill="#fff" stroke="#475569" stroke-width="2"/>
  <!-- labels -->
  <text x="330" y="139" text-anchor="middle" font-size="9" fill="#334155">s₀</text>
  <text x="290" y="334" text-anchor="middle" font-size="9" fill="#991b1b">↑</text>
  <text x="345" y="334" text-anchor="middle" font-size="9" fill="#14532d">best</text>
  <!-- move labels on edges -->
  <text x="345" y="172" font-size="9" fill="#64748b">h₂</text>
  <text x="292" y="235" font-size="9" fill="#64748b">h₇</text>
  <text x="358" y="235" font-size="9" fill="#64748b">h₁₈</text>

  <!-- selected node/move highlight -->
  <circle cx="345" cy="330" r="22" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 345 352 L 345 395" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <circle cx="345" cy="410" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="414" text-anchor="middle" font-size="9" fill="#1e3a8a">new</text>
  <text x="362" y="380" font-size="10" fill="#2563eb">apply h_k</text>

  <!-- legend -->
  <rect x="40" y="440" width="400" height="48" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="60" cy="455" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="72" y="459" font-size="10" fill="#334155">basin local min</text>
  <circle cx="60" cy="475" r="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="72" y="479" font-size="10" fill="#334155">uphill child (masked)</text>
  <line x1="190" y1="455" x2="215" y2="455" stroke="#475569" stroke-width="2"/><text x="222" y="459" font-size="10" fill="#334155">local move (1 of 19 heuristics)</text>
  <line x1="190" y1="475" x2="215" y2="475" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/><text x="222" y="479" font-size="10" fill="#334155">jump (new basin)</text>

  <!-- ===================== Arrow to encoder ===================== -->
  <path d="M 460 260 L 500 260" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="248" text-anchor="middle" font-size="10" fill="#4b5563">embed</text>

  <!-- ===================== Panel 2: Shared encoder ===================== -->
  <rect x="500" y="150" width="200" height="220" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Shared graph encoder</text>
  <rect x="520" y="195" width="160" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="600" y="217" text-anchor="middle" font-size="11" fill="#334155">features: u (solution) · v (nodes)</text>
  <rect x="520" y="238" width="160" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="600" y="260" text-anchor="middle" font-size="11" fill="#334155">3 × Gated GCN over PSG edges</text>
  <rect x="520" y="281" width="160" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="600" y="303" text-anchor="middle" font-size="11" fill="#334155">3 × block-masked Transformer</text>
  <text x="600" y="345" text-anchor="middle" font-size="10" fill="#64748b">attention restricted to one basin</text>

  <!-- ===================== Arrows to agents ===================== -->
  <path d="M 700 210 L 760 130" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 700 260 L 760 260" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 700 310 L 760 400" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

  <!-- ===================== Panel 3: Agents ===================== -->
  <!-- Node agent -->
  <rect x="765" y="70" width="320" height="110" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="785" y="98" font-size="15" font-weight="700" fill="#1e3a8a">① Node Selection Agent</text>
  <text x="785" y="120" font-size="11" fill="#1e40af">P(solution lies on the path to the local optimum)</text>
  <text x="785" y="138" font-size="11" fill="#1e40af">→ which PSG node to branch from</text>
  <text x="785" y="162" font-size="10" fill="#64748b">masks: old basins · uphill children · tried (node, move) pairs</text>

  <!-- Move agent -->
  <rect x="765" y="200" width="320" height="110" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="785" y="228" font-size="15" font-weight="700" fill="#1e3a8a">② Move Selection Agent</text>
  <text x="785" y="250" font-size="11" fill="#1e40af">P(heuristic k is the best next move | node)</text>
  <text x="785" y="268" font-size="11" fill="#1e40af">→ one of 19 local-search operators</text>
  <text x="785" y="292" font-size="10" fill="#64748b">2-opt · Or-opt · cross-exchange · Exchange(i,j) · SWAP* · …</text>

  <!-- Jump agent -->
  <rect x="765" y="340" width="320" height="140" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="785" y="368" font-size="15" font-weight="700" fill="#991b1b">③ Jump Agent</text>
  <text x="785" y="390" font-size="11" fill="#7f1d1d">triggered on stagnation; predicts an edge heat-map P(i→j)</text>
  <text x="785" y="410" font-size="11" fill="#7f1d1d">→ greedy decode of a fresh solution, or</text>
  <text x="785" y="428" font-size="11" fill="#7f1d1d">→ Hellinger-diverse pick vs. all minima found, or</text>
  <text x="785" y="446" font-size="11" fill="#7f1d1d">→ constrained beam search over 3 routes</text>
  <text x="785" y="468" font-size="10" fill="#64748b">opens a new basin in the PSG</text>

  <!-- feedback arrow back to PSG -->
  <path d="M 925 480 L 925 508 L 478 508 L 478 410 L 363 410" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 1085 255 L 1100 255 L 1100 508 L 925 508" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="500" text-anchor="middle" font-size="11" fill="#16a34a">new solution appended to the PSG → repeat</text>
</svg>
